name: Backend Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: sea_waves_test
          POSTGRES_USER: sea_waves
          POSTGRES_PASSWORD: sea_waves_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sea_waves -d sea_waves_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: api

    env:
      TEST_DATABASE_URL: postgresql+psycopg://sea_waves:sea_waves_test@localhost:5432/sea_waves_test
      DATABASE_URL: postgresql+psycopg://sea_waves:sea_waves_test@localhost:5432/sea_waves_test
      ENVIRONMENT: test
      FRONTEND_URL: http://localhost:3000
      AUTH_COOKIE_NAME: sea_waves_session
      AUTH_SESSION_HOURS: 12
      AUTH_COOKIE_SECURE: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            api/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Compile backend
        run: python -m compileall app

      - name: Run tests
        run: python -m pytest -v
